<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bagger Details</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #dcdcdc;
        }

        .form-box {
            border: 3px solid black;
            padding: 40px;
            margin: 40px auto;
            background: #e9e9e9;
            max-width: 900px;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            border: 2px solid black !important;
            background-color: white !important;
        }

        .btn-custom {
            border: 2px solid black;
            background-color: #f0f0f0;
            font-weight: bold;
            padding: 6px 35px;
        }

        img {
            border: 2px solid black;
            margin-top: 10px;
            display: none;
        }

        .row {
            margin-bottom: 22px;
        }

        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
        }
    </style>

    <script>

        function doProofPrev(event) {
            const file = event.target.files[0];

            if (file) {
                // preview
                let img = document.getElementById("proofPrev");
                img.src = URL.createObjectURL(file);
                img.style.display = "block";


                // 🔥 CALL AI (CORRECT API)
                let formData = new FormData();
                formData.append("adhaarpic", file);

                fetch("/ai-uploadprofile", {   // ✅ FIXED HERE
                    method: "POST",
                    body: formData
                })
                    .then(res => res.json())
                    .then(data => {
                        console.log("AI DATA:", data);

                        document.getElementById("name").value = data.name || "";
                        document.getElementById("dob").value = data.dob || "";
                        document.getElementById("gender").value = data.gender || "";
                        document.getElementById("proof_number").value = data.aadhaar_number || "";

                    })
                    .catch(err => console.log(err));
            }
        }


        function doPersonPrev(event) {
            const file = event.target.files[0];
            if (file) {
                let img = document.getElementById("personPrev");
                img.src = URL.createObjectURL(file);
                img.style.display = "block";
            }
        }
    </script>

</head>

<body>

    <div class="container">
        <div class="form-box">

            <h5 class="text-center mb-4"><b>Bagger Details</b></h5>

            <form method="post" action="/savebagger" enctype="multipart/form-data">

                <!-- Volunteer Email -->
                <div class="col-md-6 mb-4">
                    <label>Volunteer's Email Id</label>
                    <input type="email" name="volunteer_email" class="form-control" required>
                </div>

                <div class="section-title">
                    <b>Bagger's Details</b>
                </div>

                <!-- Name / Age / Gender -->
                <div class="row">
                    <div class="col-md-6" id="nameDiv" style="display:none">
                        <label>Name</label>
                        <input type="text" id="name" name="name" class="form-control" disabled>
                    </div>

                    <div class="col-md-3" id="dobDiv" style="display:none">
                        <label>D.O.B</label>
                        <input type="number" id="dob" name="dob" class="form-control" disabled>
                    </div>

                    <div class="col-md-3" id="genderDiv" style="display:none">
                        <label>Gender</label>
                        <select id="gender" name="gender" class="form-select" disabled>
                            <option>Select</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <!-- Address / City -->
                <div class="row">
                    <div class="col-md-8">
                        <label>Address</label>
                        <input type="text" name="address" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label>City</label>
                        <input type="text" name="city" class="form-control">
                    </div>
                </div>

                <!-- Type of Work / Contact -->
                <div class="row">
                    <div class="col-md-6">
                        <label>Type of Work</label>
                        <select name="work_type" class="form-select">
                            <option>Select</option>
                            <option>Cleaner</option>
                            <option>Housekeeping</option>
                            <option>Sanitation Worker</option>
                            <option>Garbage Collector</option>
                            <option>Plumber</option>
                            <option>Electrician Helper</option>
                            <option>Carpenter Helper</option>
                            <option>Painter Helper</option>
                            <option>Construction Labor</option>
                            <option>Mason Helper</option>
                            <option>Loader</option>
                            <option>Unloader</option>
                            <option>Warehouse Worker</option>
                            <option>Packer</option>
                            <option>Sorter</option>
                            <option>Gardener</option>
                            <option>Security Guard</option>
                            <option>Domestic Helper</option>
                            <option>Cook Helper</option>
                            <option>Office Boy</option>
                            <option>Driver Helper</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label>Contact Number</label>
                        <input type="text" name="contact_number" class="form-control">
                    </div>
                </div>

                <!-- ID Proof -->
                <div class="row">

                    <div class="col-md-4">
                        <label>Id Proof</label>
                        <select name="id_proof" class="form-select">
                            <option>Voter ID</option>
                            <option>Aadhar Card</option>
                            <option>Ration Card</option>
                        </select>

                        <label id="proofLabel" class="mt-3" style="display:none">Proof No.</label>
                        <input type="text" id="proof_number" name="proof_number" class="form-control" disabled
                            style="display:none">
                    </div>

                    <div class="col-md-4 text-center">
                        <label>Upload Proof Pic</label>
                        <input type="file" name="proof_pic" class="form-control" onchange="doProofPrev(event)">
                        <img id="proofPrev" width="120" height="120">
                    </div>

                    <div class="col-md-4 text-center">
                        <label>His/Her Pic</label>
                        <input type="file" name="person_pic" class="form-control" onchange="doPersonPrev(event)">
                        <img id="personPrev" width="120" height="120">
                    </div>

                </div>

                <!-- Submit -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-custom">Publish Data</button>
                </div>

            </form>

        </div>
    </div>

</body>

</html>
